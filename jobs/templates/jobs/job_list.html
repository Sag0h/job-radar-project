<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>JobRadar</title>
</head>

<body>

    <h1>JobRadar</h1>

    <h2>Ofertas encontradas</h2>

    {% for job in jobs %}

        <article>
            <h3>{{ job.title }}</h3>

            <p>
                {{ job.company }}
            </p>

            <p>
                {{ job.location }}
            </p>

            <p>
                {{ job.description }}
            </p>

            <a href="{{ job.url }}" target="_blank">
                Ver oferta
            </a>
        </article>

        <hr>

    {% empty %}

        <p>No hay ofertas disponibles.</p>

    {% endfor %}

</body>
</html>
